name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 纯 Node 回归资产；集成测试（test-admin/smoke）要显式 --base，不在 CI 里打真实服务。
      - name: syntax check
        shell: bash
        run: |
          git ls-files '*.mjs' | while IFS= read -r f; do
            node --check "$f"
          done
      - name: unit tests
        shell: bash
        run: npm test
